trigger: none

pr: none

jobs:
- job: STM32_Build_Diagnostic
  timeoutInMinutes: 60
  pool:
    name: Default
    demands:
      - agent.name -equals no-OS
  steps:
  - checkout: self
    fetchDepth: 50
    submodules: true
    clean: true
    persistCredentials: true

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      echo "=== CPU ==="
      nproc
      cat /proc/cpuinfo | grep "model name" | head -1
      echo "=== Memory ==="
      free -h
      echo "=== Disk ==="
      df -h $(Build.Repository.LocalPath)
      df -h /no-OS_builds/ 2>/dev/null || true
      echo "=== CMake ==="
      cmake --version | head -1
      echo "=== Ninja ==="
      ninja --version
      echo "=== Workspace ==="
      echo "$(Build.Repository.LocalPath)"
      echo "=== STM32 SDK ==="
      echo "STM32CubeIDE: $STM32CUBEIDE"
      echo "STM32CubeMX: $STM32CUBEMX"
      IDE_VER=$(sed -n 's/^version=//p' "$STM32CUBEIDE/.eclipseproduct" 2>/dev/null)
      echo "CubeIDE version: ${IDE_VER:-unknown}"
    displayName: 'System info'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      echo "=== Discovering all STM32 combos ==="
      python3 $(Build.Repository.LocalPath)/tools/scripts/no_os_build.py list \
        --repo-root $(Build.Repository.LocalPath) \
        --platform stm32 2>/dev/null | tee /tmp/stm32_combos.txt || true
      echo "=== Combo count ==="
      wc -l < /tmp/stm32_combos.txt || echo "list command not available, counting build dirs..."
      ls /no-OS_builds/builds_main_cmake/ 2>/dev/null | grep -v "^build-" | grep -v "^builds" | wc -l
    displayName: 'Count STM32 project combos'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      TEST_PROJECT=ad405x
      TEST_VARIANT=basic
      TEST_BOARD=nucleo-h563zi
      SRC=$(Build.Repository.LocalPath)
      BUILD_DIR=/tmp/diag-fresh
      rm -rf $BUILD_DIR

      echo "=== Configure (--fresh, cold) ==="
      time cmake -B $BUILD_DIR \
        --preset $TEST_BOARD \
        -DPROJECT_DEFCONFIG=$TEST_PROJECT/$TEST_VARIANT.conf \
        --fresh \
        -DPROBE=openocd \
        -S $SRC 2>&1 | tail -60

      echo ""
      echo "=== Build ==="
      time cmake --build $BUILD_DIR --target $TEST_PROJECT -j 4 2>&1 | tail -60

      echo ""
      echo "=== CubeMX stamp check ==="
      find $BUILD_DIR -name ".cubemx_stamp" -exec echo "Stamp: {}" \; -exec cat {} \;
    displayName: 'Test 1: Single build WITH --fresh (cold configure)'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      TEST_PROJECT=ad405x
      TEST_VARIANT=basic
      TEST_BOARD=nucleo-h563zi
      SRC=$(Build.Repository.LocalPath)
      BUILD_DIR=/tmp/diag-fresh

      echo "=== Configure (--fresh, warm objects) ==="
      time cmake -B $BUILD_DIR \
        --preset $TEST_BOARD \
        -DPROJECT_DEFCONFIG=$TEST_PROJECT/$TEST_VARIANT.conf \
        --fresh \
        -DPROBE=openocd \
        -S $SRC 2>&1 | tail -60

      echo ""
      echo "=== Build (should be near-instant if Ninja sees no changes) ==="
      time cmake --build $BUILD_DIR --target $TEST_PROJECT -j 4 2>&1 | tail -60

      echo ""
      echo "=== Ninja build log stats ==="
      ninja -C $BUILD_DIR -n -d stats 2>&1 | tail -60 || true
    displayName: 'Test 2: Re-configure WITH --fresh (warm objects)'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      TEST_PROJECT=ad405x
      TEST_VARIANT=basic
      TEST_BOARD=nucleo-h563zi
      SRC=$(Build.Repository.LocalPath)
      BUILD_DIR=/tmp/diag-fresh

      echo "=== Configure (no --fresh, fully incremental) ==="
      time cmake -B $BUILD_DIR \
        --preset $TEST_BOARD \
        -DPROJECT_DEFCONFIG=$TEST_PROJECT/$TEST_VARIANT.conf \
        -DPROBE=openocd \
        -S $SRC 2>&1 | tail -60

      echo ""
      echo "=== Build ==="
      time cmake --build $BUILD_DIR --target $TEST_PROJECT -j 4 2>&1 | tail -60
    displayName: 'Test 3: Configure WITHOUT --fresh (incremental)'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      SRC=$(Build.Repository.LocalPath)
      BASE_DIR=/tmp/diag-multi
      rm -rf $BASE_DIR

      COMBOS=(
        "ad405x:basic:nucleo-h563zi"
        "ad463x_fmcz:basic:sdp-ck1z"
        "ad74413r:iio:nucleo-f756zg"
        "iio_demo:iio:sdp-ck1z"
        "eval-adxl38x:basic:nucleo-f767zi"
      )

      TOTAL_START=$SECONDS
      for combo in "${COMBOS[@]}"; do
        IFS=: read -r proj var board <<< "$combo"
        BUILD_DIR="$BASE_DIR/$proj-$var-$board"
        COMBO_START=$SECONDS

        echo "=== Building $proj/$var for $board ==="

        echo "  Configure..."
        CFG_START=$SECONDS
        cmake -B "$BUILD_DIR" \
          --preset "$board" \
          -DPROJECT_DEFCONFIG="$proj/$var.conf" \
          --fresh \
          -DPROBE=openocd \
          -S $SRC > /dev/null 2>&1
        CFG_TIME=$((SECONDS - CFG_START))

        echo "  Build..."
        BLD_START=$SECONDS
        cmake --build "$BUILD_DIR" --target "$proj" -j 4 > /dev/null 2>&1
        BLD_TIME=$((SECONDS - BLD_START))

        COMBO_TIME=$((SECONDS - COMBO_START))
        echo "  Configure: ${CFG_TIME}s | Build: ${BLD_TIME}s | Total: ${COMBO_TIME}s"

        if find "$BUILD_DIR" -name ".cubemx_stamp" -newer "$BUILD_DIR/CMakeCache.txt" 2>/dev/null | grep -q .; then
          echo "  CubeMX: regenerated"
        else
          echo "  CubeMX: cached"
        fi
        echo ""
      done
      TOTAL_TIME=$((SECONDS - TOTAL_START))
      echo "=== Total for 5 combos: ${TOTAL_TIME}s (avg $((TOTAL_TIME / 5))s per combo) ==="
    displayName: 'Test 4: Profile 5 combos serially with --fresh'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      SRC=$(Build.Repository.LocalPath)
      BASE_DIR=/tmp/diag-multi

      COMBOS=(
        "ad405x:basic:nucleo-h563zi"
        "ad463x_fmcz:basic:sdp-ck1z"
        "ad74413r:iio:nucleo-f756zg"
        "iio_demo:iio:sdp-ck1z"
        "eval-adxl38x:basic:nucleo-f767zi"
      )

      TOTAL_START=$SECONDS
      for combo in "${COMBOS[@]}"; do
        IFS=: read -r proj var board <<< "$combo"
        BUILD_DIR="$BASE_DIR/$proj-$var-$board"
        COMBO_START=$SECONDS

        echo "=== Rebuilding $proj/$var for $board (warm) ==="

        echo "  Configure (--fresh)..."
        CFG_START=$SECONDS
        cmake -B "$BUILD_DIR" \
          --preset "$board" \
          -DPROJECT_DEFCONFIG="$proj/$var.conf" \
          --fresh \
          -DPROBE=openocd \
          -S $SRC > /dev/null 2>&1
        CFG_TIME=$((SECONDS - CFG_START))

        echo "  Build..."
        BLD_START=$SECONDS
        cmake --build "$BUILD_DIR" --target "$proj" -j 4 > /dev/null 2>&1
        BLD_TIME=$((SECONDS - BLD_START))

        COMBO_TIME=$((SECONDS - COMBO_START))
        echo "  Configure: ${CFG_TIME}s | Build: ${BLD_TIME}s | Total: ${COMBO_TIME}s"
        echo ""
      done
      TOTAL_TIME=$((SECONDS - TOTAL_START))
      echo "=== Total warm re-run: ${TOTAL_TIME}s (avg $((TOTAL_TIME / 5))s per combo) ==="
    displayName: 'Test 5: Re-run same 5 combos (warm cache)'

  - script: |
      [ -f /no-OS_agent/.stm32_environment.sh ] && . /no-OS_agent/.stm32_environment.sh
      STM32CUBEIDE="${STM32CUBEIDE:-/opt/stm32cubeide}"
      STM32CUBEMX="${STM32CUBEMX:-/opt/stm32cubemx}"
      export STM32CUBEIDE STM32CUBEMX

      SRC=$(Build.Repository.LocalPath)
      BASE_DIR=/tmp/diag-multi

      COMBOS=(
        "ad405x:basic:nucleo-h563zi"
        "ad463x_fmcz:basic:sdp-ck1z"
        "ad74413r:iio:nucleo-f756zg"
        "iio_demo:iio:sdp-ck1z"
        "eval-adxl38x:basic:nucleo-f767zi"
      )

      TOTAL_START=$SECONDS
      for combo in "${COMBOS[@]}"; do
        IFS=: read -r proj var board <<< "$combo"
        BUILD_DIR="$BASE_DIR/$proj-$var-$board"
        COMBO_START=$SECONDS

        echo "=== Rebuilding $proj/$var for $board (no --fresh) ==="

        echo "  Configure..."
        CFG_START=$SECONDS
        cmake -B "$BUILD_DIR" \
          --preset "$board" \
          -DPROJECT_DEFCONFIG="$proj/$var.conf" \
          -DPROBE=openocd \
          -S $SRC > /dev/null 2>&1
        CFG_TIME=$((SECONDS - CFG_START))

        echo "  Build..."
        BLD_START=$SECONDS
        cmake --build "$BUILD_DIR" --target "$proj" -j 4 > /dev/null 2>&1
        BLD_TIME=$((SECONDS - BLD_START))

        COMBO_TIME=$((SECONDS - COMBO_START))
        echo "  Configure: ${CFG_TIME}s | Build: ${BLD_TIME}s | Total: ${COMBO_TIME}s"
        echo ""
      done
      TOTAL_TIME=$((SECONDS - TOTAL_START))
      echo "=== Total no-fresh: ${TOTAL_TIME}s (avg $((TOTAL_TIME / 5))s per combo) ==="
    displayName: 'Test 6: Same 5 combos WITHOUT --fresh'

  - script: |
      echo "=== Azure workspace build dir ==="
      WS_DIR=/no-OS_builds/builds_main_cmake/ad405x-basic-nucleo-h563zi
      if [ -d "$WS_DIR" ]; then
        echo "Exists: yes"
        ls "$WS_DIR"/*.o 2>/dev/null | wc -l | xargs -I{} echo "Object files: {}"
        find "$WS_DIR" -name ".cubemx_stamp" -exec echo "CubeMX stamp: {}" \;
        echo "CMakeCache source dir:"
        grep "CMAKE_HOME_DIRECTORY" "$WS_DIR/CMakeCache.txt" 2>/dev/null || echo "No CMakeCache"
      else
        echo "Exists: no"
      fi

      echo ""
      echo "=== GitHub workspace build dir ==="
      GH_DIR=/no-OS-oss-github-agent/_work/no-OS/no-OS/builds_main_cmake/ad405x-basic-nucleo-h563zi
      if [ -d "$GH_DIR" ]; then
        echo "Exists: yes"
        ls "$GH_DIR"/*.o 2>/dev/null | wc -l | xargs -I{} echo "Object files: {}"
        find "$GH_DIR" -name ".cubemx_stamp" -exec echo "CubeMX stamp: {}" \;
        echo "CMakeCache source dir:"
        grep "CMAKE_HOME_DIRECTORY" "$GH_DIR/CMakeCache.txt" 2>/dev/null || echo "No CMakeCache"
      else
        echo "Exists: no"
      fi
    displayName: 'Test 7: Compare Azure vs GitHub build dir state'

  - script: |
      BUILD_BASE=/no-OS_builds/builds_main_cmake
      if [ ! -d "$BUILD_BASE" ]; then
        echo "No builds_main_cmake directory found"
        exit 0
      fi

      TOTAL=$(find "$BUILD_BASE" -maxdepth 1 -type d | wc -l)
      WITH_STAMP=$(find "$BUILD_BASE" -name ".cubemx_stamp" | wc -l)
      echo "Build dirs: $((TOTAL - 1))"
      echo "CubeMX stamps found: $WITH_STAMP"

      echo ""
      echo "=== Sample stamp contents (first 5) ==="
      find "$BUILD_BASE" -name ".cubemx_stamp" | head -5 | while read f; do
        echo "$f: $(cat "$f")"
      done
    displayName: 'Test 8: CubeMX stamp freshness across build dirs'

  - script: rm -rf /tmp/diag-fresh /tmp/diag-multi
    displayName: 'Cleanup diagnostic builds'
    condition: always()
