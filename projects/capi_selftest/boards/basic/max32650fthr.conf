# Maxim board for capi_selftest (basic variant).
#
# This file's presence enables the (basic, max32650fthr) combo in no_os_build.py; its
# content is NOT merged into the build. CAPI module selection comes from
# ../../basic.conf, and board identity (TARGET, TARGET_NUM, BOARD) comes from the
# CMake preset "max32650fthr" in board_configs/maxim/CMakePresets.json.
#
# Console UART only: no loopback strap has been characterised on this board, so
# parameters.h leaves UART_ASYNC_MAX_IDENTIFIER and the GPIO strap undefined and
# those suites report NOT_CONFIGURED. Add them once the header wiring is known.
#
# STATUS: builds only -- never run on hardware.
