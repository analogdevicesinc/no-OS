# Dual-core example configuration for LTC4284 on MAX32690
#
# Usage:
#   cmake --preset max32690evkit -DPROJECT_DEFCONFIG=ltc4284/dual_core.conf
#
# This example demonstrates dual-core LTC4284 hot swap monitoring:
#   - ARM Cortex-M4:  Main control loop, I2C communication, UART console
#   - RISC-V RV32:    Real-time overcurrent monitoring via GPIO interrupt
#
# The RISC-V core monitors the LTC4284 ALERT pin for overcurrent events
# and communicates status to the ARM core via IPC (SEMA mailbox).
#
# Note: MAX32690 uses CMake-based dual-core build (maxim_add_riscv_coprocessor).
#       CONFIG_COPROCESSOR=y enables coprocessor subsystem support.
#       CONFIG_COPROCESSOR_MAXIM is MAX78000-specific and not needed for MAX32690.

# Enable required platform drivers
CONFIG_UART=y
CONFIG_IRQ=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_DMA=y

# Enable coprocessor and IPC support
# IPC_MAXIM selects IPC; COPROCESSOR_MAXIM depends on IPC_MAXIM.
CONFIG_COPROCESSOR=y
CONFIG_COPROCESSOR_MAXIM=y
CONFIG_IPC_MAXIM=y

# Enable power subsystem
CONFIG_POWER=y
CONFIG_POWER_LTC4284=y

# Select dual-core example (disable others since it's a choice)
# CONFIG_LTC4284_BASIC_EXAMPLE is not set
# CONFIG_LTC4284_OVERCURRENT_EXAMPLE is not set
CONFIG_LTC4284_DUAL_CORE_EXAMPLE=y
