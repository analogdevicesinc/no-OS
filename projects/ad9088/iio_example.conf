# AD9088_PROFILE is board-specific (the FPGA bitstream fixes the JESD mode), so
# it is set per board under boards/iio_example/<board>.conf rather than here.
# Setting it here would override the board file, which is applied first.
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_UART=y
CONFIG_IRQ=y
CONFIG_TIMER=y
CONFIG_DMA=y
CONFIG_CLK=y
CONFIG_RF_TRANSCEIVER=y
CONFIG_RF_TRANSCEIVER_AD9088=y
CONFIG_FREQUENCY=y
CONFIG_FREQUENCY_ADF4030=y
CONFIG_FREQUENCY_ADF4382=y
CONFIG_FREQUENCY_HMC7044=y
CONFIG_AXI_CORE=y
CONFIG_AXI_CORE_AXI_ADC_CORE=y
CONFIG_AXI_CORE_AXI_DAC_CORE=y
CONFIG_AXI_CORE_AXI_DMAC=y
CONFIG_AXI_CORE_CLK_AXI_CLKGEN=y
CONFIG_AXI_CORE_JESD204=y
# IIO server: the infrastructure plus the AXI ADC/DAC IIO wrappers, and the
# Altera JTAG-UART + CLIC IRQ transport the IIOD server runs on (Agilex/Nios V).
CONFIG_IIO=y
CONFIG_AXI_CORE_IIO_AXI_ADC=y
CONFIG_AXI_CORE_IIO_AXI_DAC=y
CONFIG_UART_ALTERA=y
CONFIG_IRQ_ALTERA=y
CONFIG_AD9088_IIO_EXAMPLE=y
