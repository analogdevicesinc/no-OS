# Nios V on-chip memory holds only one ~570 KB signed firmware set, not both.
# The AD9084-EBZ carries engineering silicon, so embed that set only.
CONFIG_AD9088_FW_SET_ENG=y

# JESD204C, L2/M4/NP16 per link, 10.3125 Gbps lanes, 156.25 MHz link clock,
# 10 GHz device clock. Keep in step with the CONFIG_ALTERA_PLATFORM_NIOSV block
# in src/common/common_data.h, which fixes the ADF4382/HMC7044 divides for this
# profile's dev_clk.
CONFIG_AD9088_PROFILE="204C_L2_M4_NP16_10p0_8x4.bin"
