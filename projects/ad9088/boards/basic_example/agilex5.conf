# Nios V on-chip memory holds only one ~570 KB signed firmware set, not both.
# The AD9084-EBZ carries engineering silicon, so embed that set only.
CONFIG_AD9088_FW_SET_ENG=y

# JESD204C, L2/M4/NP16 per link, 11.1375 Gbps lanes, 168.75 MHz link clock,
# 10.8 GHz device clock. Both directions run 337.5 MSPS: RX decimates the
# 10.8 GHz ADC clock by 32, TX interpolates the 21.6 GHz DAC clock by 64. Keep in
# step with the CONFIG_ALTERA_PLATFORM_NIOSV block in src/common/common_data.h,
# which fixes the ADF4382/HMC7044/ADF4030 frequencies for this profile's dev_clk.
CONFIG_AD9088_PROFILE="204C_L2_M4_NP16_10p8_8x8_8x4.bin"
