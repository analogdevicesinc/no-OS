# Nios V on-chip memory holds only one ~570 KB signed firmware set, not both.
# The AD9084-EBZ carries engineering silicon, so embed that set only.
CONFIG_AD9088_FW_SET_ENG=y

# The AD9084-EBZ Agilex 5 bitstream (ad9084_ebz_nios_a5e) is a JESD204B design:
# per-link M4/L2 x2, 10 Gbps, 250 MHz link clock. Use the matching use-case
# profile (Kconfig default stays 204C for the MicroBlaze/vcu118 build).
CONFIG_AD9088_PROFILE="204B_L2_M4_NP16_16p0_16x4.bin"
