# VCU118 + AD9084-FMCA-EBZ.
#
# The device profile must match the HDL design on the carrier, so it is owned
# here rather than in basic_example.conf: board .conf files are merged before
# the variant .conf, so a profile left in the variant would override every
# board. See dev_doc/VCK190_ENABLEMENT.md.
#
# Two links of M4/L8 at 20.625 Gbps, matching
# arch/microblaze/boot/dts/vcu118_ad9084_204C_M4_L8_NP16_20p0_4x2_CLL.dts.
CONFIG_AD9088_PROFILE="204C_M4_L8_NP16_20p0_4x2.bin"
