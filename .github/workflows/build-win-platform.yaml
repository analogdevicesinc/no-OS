name: Build projects for windows platform

on:
  pull_request:
    branches:
      - main
      - next_stable
      - 'release/*'
      - '20*'
      - 'staging/*'   # TEST
    paths-ignore:
      - '**/*.rst'
      - '**/*.md'
      - 'drivers/platform/stm32/**'
      - 'drivers/platform/pico/**'
      - 'drivers/platform/aducm3029/**'
      - 'drivers/platform/maxim/**'
      - 'drivers/platform/xilinx/**'
      - 'drivers/platform/mac/**'
      - '.github/config/**'
      - '.github/scripts/**'
      - '.github/workflows/build-pico-platform.yaml'
      - '.github/workflows/build-maxim-platform.yaml'
      - '.github/workflows/build-mac-platform.yaml'
      - '.github/workflows/build-linux-userspace-platform.yaml'
      - '.github/workflows/build-aducm3029-platform.yaml'
      - '.github/workflows/build-stm32-platform.yaml'
      - '.github/workflows/build-common.yaml'
      - '.github/workflows/deploy-docs.yaml'
  push:
    branches:
      - main
      - next_stable
      - 'release/*'
      - '20*'
    paths-ignore:
      - '**/*.rst'
      - '**/*.md'
      - 'drivers/platform/stm32/**'
      - 'drivers/platform/pico/**'
      - 'drivers/platform/aducm3029/**'
      - 'drivers/platform/maxim/**'
      - 'drivers/platform/xilinx/**'
      - 'drivers/platform/mac/**'
      - '.github/config/**'
      - '.github/scripts/**'
      - '.github/workflows/build-pico-platform.yaml'
      - '.github/workflows/build-maxim-platform.yaml'
      - '.github/workflows/build-mac-platform.yaml'
      - '.github/workflows/build-linux-userspace-platform.yaml'
      - '.github/workflows/build-aducm3029-platform.yaml'
      - '.github/workflows/build-stm32-platform.yaml'
      - '.github/workflows/build-common.yaml'
      - '.github/workflows/deploy-docs.yaml'

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows-projects:
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      BLACKLIST_URL: ${{ secrets.BLACKLIST_URL }}
      HDL_BRANCH: 'main'
      BUILDS_DIR: ${{ github.workspace }}/builds
      RELEASES_DIR: ${{ github.workspace }}/latest_build
      LOGS_DIR: ${{ github.workspace }}/logs
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false
          clean: false
      - name: Setyp python3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Setup cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@159f1619275d5d3147f059c3cc110938ec221d16 # v2.0.3
        with:
          api-key: ${{ env.CLOUDSMITH_API_KEY }}
      - name: Download dependencies
        shell: bash
        run: |
          pip install requests

          cloudsmith download ${{ secrets.DEPENDENCIES_REPO }} CDM-v2.12.36.20-WHQL-Certified.zip
          cloudsmith download ${{ secrets.DEPENDENCIES_REPO }} LibMPSSE_1.0.7.zip

          python3 tools/scripts/config_ftd2xx.py \
            --local-mpsse LibMPSSE_1.0.7.zip \
            --local-d2xx CDM-v2.12.36.20-WHQL-Certified.zip
      - name: Building for platform windows
        shell: bash
        run: |
          echo "Setup cloudsmith helper ..."
          wget https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O ./tools/scripts/cloudsmith_temp.py
          cat tools/scripts/cloudsmith_temp.py | sed 's#/usr/bin/python3#/usr/bin/env python3#' > tools/scripts/cloudsmith_helper.py
          rm tools/scripts/cloudsmith_temp.py

          echo "Running project build ..."
          ${{ github.workspace }}/tools/scripts/build_projects.py \
            ${{ github.workspace }} \
            -export_dir ${{ env.RELEASES_DIR }} \
            -log_dir ${{ env.LOGS_DIR }} \
            -builds_dir ${{ env.BUILDS_DIR }} \
            -platform win \
            -hdl_branch ${{ env.HDL_BRANCH }}
        env:
          CLOUDSMITH_API_KEY: ${{ env.CLOUDSMITH_API_KEY }}
          TOKEN: ${{ secrets.GH_GHDL_TOKEN }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASES_DIR }}
          name: ${{ github.job }}-binaries
      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.LOGS_DIR }}
          name: ${{ github.job }}-logs
