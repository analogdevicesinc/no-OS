name: Workflow for checkers, drivers and unit-tests

on:
  pull_request:
    branches:
      - main
      - staging/*
      - next_stable
      - '20*'

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: write

env:
  NUM_JOBS: 4

jobs:
  run-checkers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 50
          clean: true
      - name: Astyle check
        shell: sh
        run: |
          ${{ github.workspace }}/.github/scripts/astyle.sh
        env:
          NUM_JOBS: ${{ env.NUM_JOBS }}
          TARGET_BRANCH: ${{ github.base_ref }}
          WORKSPACE: ${{ github.workspace }}
      - name: Check-cpp format
        shell: sh
        run: |
          ${{ github.workspace }}/.github/scripts/cppcheck.sh
  build-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get changed drivers files
        id: changed-drivers-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            "drivers/**.c"
      - name: Generate drivers report
        shell: sh
        run: |
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          pip install tabulate html_to_markdown actions-toolkit
          ${{ github.workspace }}/.github/scripts/drivers-warnings.py
        env:
          CHANGED_FILES: ${{ steps.changed-drivers-files.outputs.all_changed_files }}
      - name: Report drivers build to PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: analogdevicesinc/shared-actions/pr-comment@main
        with:
          marker: driver-builds-report
          body-file: drivers_warnings.md
  unit-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup test tools
        shell: bash
        run: |
          sudo apt-get install ruby-full
          sudo gem install ceedling --no-document
          pip install gcovr==4.1
          find tests -name "project.yml" -type f | while read project_file; do
            dir=$(dirname "$project_file")
            cd "$dir" && ceedling test:all && cd -
          done
      - name: Run unit tests
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386   # @v6.4.0
        with:
          report_paths: tests/drivers/**/build/artifacts/test/*.xml
          include_passed: true
          pr_id: ${{ github.event == 'pull_request' && github.event.pull_request.number }}
          comment: ${{ github.event == 'pull_request' && 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateComment: ${{ github.event_name == 'pull_request' && 'true' }}
